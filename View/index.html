<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alyssa Schmidt">
    <meta name="author" content="Benjamin Nguyen">
    <meta name="author" content="Dre Harm">
    <meta name="author" content="Ethan Larson">
    <meta name="author" content="Rachal Thornton">
    <title>Warrior Chat</title>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="Styles/home.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo-section"> <!-- for the WSU logo-->
                    <div class="logo-box">

                    </div>
                </div>
                <div class="nav-buttons">
                    <a class="nav-btn active" data-page="home" href="index.html">Home</a>
                    <a class="nav-btn" data-page="groups" href="groups.html">Groups</a>
                    <button class="nav-btn" data-page="about">About</button>
                </div>
                <span id="greeting" class="nav-greeting" hidden></span>
                <span id="majorLabel" class="major-label" hidden></span>
                <button class="nav-btn login-btn" id="loginBtn">Login / Create Account</button>
            </div>
        </div>
    </nav>
    <main id="guestPage" class="main-content landing" hidden>
        <section class="top-section">
            <div class="bg-image"></div>
            <!-- We'll need to add a bunch of div's or parapraphs for the text, 
             if I set up the background image correctly, the image shouldn't interfere with the text -->
        </section>
        <section class="groups-section">
            <div class="groups-header">
                <div class="groups-title">Popular Groups</div>
                <div class="groups-view-all">View All</div>
            </div>
            <!-- the view can eventually fill this from the model but I just wanted to mock up a place holder -->
            <div class="group-scroller" id="groupScroller">
                <div class="group-card">
                    <div class="group-icon"></div>
                    <div class="group-name"></div>
                    <div class="group-members"></div>
                    <div class="group-tag"></div>
                </div>
            </div>
        </section>
    </main>
    <main id="homePage" class="main-content home-layout" hidden>
        <aside class="home-left">
            <section id="profile-panel" class="home-panel">
                <div id="profileCard">
                </div>
                <nav id="sidebarNav"></nav>
            </section>
            <section id="myGroupsPanel" class="home-panel">
            </section>
        </aside>
        <div class="home-center">
            <section id="postSimpleMessage" class="home-panel">
                <form id="postForm">
                    <textarea name="message" rows="3" placeholder="What's on your mind?"></textarea>
                    <span id="wordCount"></span>
                    <input type="file" name="attachment">
                    <button type="submit">Post</button>
                    <p id="postStatus"></p>
                </form>
            </section>
            <section id="feedHeader"></section>
            <p id="feedStatus"></p>
            <section id="postFeed"></section>
        </div>
        <aside class="home-right">
            <section id="quickLinksPanel" class="home-panel"></section>
            <section id="trendingGroupsPanel" class="home-panel">
            </section>
        </aside>
    </main>
    <main id="groupsChatPage" class="groupsChatPageLayout" hidden>
        <aside class="home-left">
            <section id="profile-panel" class="home-panel">
                <div id="profileCard">
                </div>
                <nav id="sidebarNav"></nav>
            </section>
            <section id="myGroupsPanel" class="home-panel">
            </section>
        </aside>
        <div class="home-center">
            <section id="postSimpleMessage" class="home-panel"></section>
            <section id="feedHeader"></section>
            <section id="postFeed"></section>
        </div>
        <aside class="home-right">
            <section id="quickLinksPanel" class="home-panel"></section>
            <section id="trendingGroupsPanel" class="home-panel">
            </section>
        </aside>
    </main>
    <!-- Our popups/modals can go here just to keep things organized -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="login-body">
                <div class="modal-logo"></div> <!-- for the logo -->
                <h2>Welcome Back</h2>
                <p class="login-subtitle">Log in to your WSU forum account</p>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="WSU Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <div class="form-row">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                        <!-- this will eventually link to something -->
                    </div>
                    <p id="loginError" class="form-error" hidden></p>
                    <button type="submit" class="submit-btn" id="loginSubmit">Login</button>
                </form>
                <p class="signup-prompt">Don't have an account? <a href="#" id="signupLink">Sign Up</a></p>
                <!-- this will eventually link to the create account page -->
            </div>
        </div>
    </div>
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <div class="login-body">
                <div class="modal-logo"></div>
                <h2>Create Account</h2>
                <p class="login-subtitle">Join the WSU forum</p>
                <form id="signupForm">

                    <div class="form-row-split">
                        <div class="form-group">
                            <input type="text" id="signupFirstName" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="signupLastName" placeholder="Last Name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="role-label">I am a:</label>
                        <div class="role-options">
                            <div class="role-option">
                                <input type="radio" name="signupRole" value="student" checked>Student</input>
                            </div>
                            <div class="role-option">
                                <input type="radio" name="signupRole" value="professor">Professor</input>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="signupMajor" list="majorOptions" placeholder="Major / Program" required>
                        <datalist id="majorOptions"></datalist>
                    </div>
                    <div class="form-group">
                        <input type="email" id="signupEmail" placeholder="WSU Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="signupPassword" placeholder="Password" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                    </div>

                    <p id="signupError" class="form-error" hidden></p>
                    <button type="submit" class="submit-btn" id="signupSubmit">Create Account</button>
                </form>
            </div>
        </div>
    </div>
    <!-- If we need to add more JS files or want to break this up more we can but I'm just planning out the MVC -->
    <script type="module" src="../Controller/ForumController.js"></script>
</body>

</html>
