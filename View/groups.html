<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alyssa Schmidt">
    <meta name="author" content="Benjamin Nguyen">
    <meta name="author" content="Dre Harm">
    <meta name="author" content="Ethan Larson">
    <meta name="author" content="Rachal Thornton">
    <title>Groups - Warrior Chat</title>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="Styles/groups.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo-section"> <!-- for the WSU logo-->
                    <div class="logo-box">

                    </div>
                </div>
                <div class="nav-buttons">
                    <a class="nav-btn" data-page="home" href="index.html">Home</a>
                    <a class="nav-btn active" data-page="groups" href="groups.html">Groups</a>
                    <button class="nav-btn" data-page="about">About</button>
                </div>
                <span id="greeting" class="nav-greeting" hidden></span>
                <span id="majorLabel" class="major-label" hidden></span>
                <button class="nav-btn login-btn" id="logoutBtn">Log Out</button>
            </div>
        </div>
    </nav>
    <main id="groupsPage" class="main-content groups-page" hidden>
        <div class="groups-page-header">
            <div>
                <h1 class="groups-page-title">Groups</h1>
                <p class="groups-page-subtitle">Explore and join groups that match your interests.</p>
            </div>
            <button class="submit-btn create-group-btn" id="createGroupBtn">Create Group</button>
        </div>

        <!-- currently these are just place holders since I don't know how to get them to work yet -->
        <input type="search" class="groups-search" id="groupsSearch" placeholder="Search groups...">
        <div class="group-filters" id="groupFilters"></div>

        <p id="groupsStatus" class="groups-status" hidden></p>
        <section class="group-grid" id="groupGrid"></section>
    </main>

    <div id="createGroupModal" class="modal"> <!-- i'm just reusing the same modal I used for login/create account-->
        <div class="modal-content">
            <div class="login-body">
                <div class="modal-logo"></div>
                <h2>Create Group</h2>
                <p class="login-subtitle">Start a new group for other WSU students</p>
                <form id="createGroupForm">
                    <div class="form-group">
                        <input type="text" id="groupName" placeholder="Group Name" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <select id="groupType" required></select> <!-- GroupsView fills in the types -->
                    </div>
                    <div class="form-group">
                        <label class="role-label" for="groupIcon">Profile image (optional)</label>
                        <input type="file" id="groupIcon" accept="image/png,image/jpeg,image/gif,image/webp">
                    </div>
                    <div class="form-group">
                        <label class="role-label" for="groupBanner">Background image (optional)</label>
                        <input type="file" id="groupBanner" accept="image/png,image/jpeg,image/gif,image/webp">
                    </div>
                    <p id="createGroupError" class="form-error" hidden></p>
                    <button type="submit" class="submit-btn" id="createGroupSubmit">Create Group</button>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="../Controller/GroupsController.js"></script>
</body>
</html>
